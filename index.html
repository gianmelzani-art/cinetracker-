<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CineTracker Base44 Replica</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS per Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        iframe#netlify-identity-widget, .netlify-identity-menu, a[href*="netlify.com"], div:has(> a[href*="netlify.com"]), [id*="netlify"] {
            display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important;
        }
        body {
            background-color: #0c0d10; color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent; overflow-x: hidden;
            padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
        }
        #fxCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; opacity: 0.85; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-28" id="mainBody">

    <canvas id="fxCanvas" class="hidden"></canvas>

    <!-- Header Style Base44 -->
    <header class="px-5 py-4 flex justify-between items-center bg-[#0c0d10]/95 backdrop-blur-xl sticky top-0 z-40 border-b border-white/5">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-sm">
                <i class="fa-solid fa-play text-xs"></i>
            </div>
            <h1 class="text-base font-bold tracking-tight text-white">CineTracker <span class="text-xs font-normal text-zinc-500">| Base44</span></h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="resetData()" class="bg-zinc-900 active:scale-95 text-zinc-400 hover:text-rose-400 px-3 py-1.5 rounded-xl text-xs font-medium border border-zinc-800 transition" title="Ripristina Dati Excel">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <label class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white px-3.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-2 cursor-pointer border border-zinc-700 transition">
                <i class="fa-solid fa-file-excel text-emerald-400"></i> Importa Excel
                <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" onchange="importExcelFile(event)" class="hidden">
            </label>
        </div>
    </header>

    <!-- Contenuto Principale -->
    <main class="flex-grow px-5 flex flex-col gap-6 max-w-6xl mx-auto w-full pt-4 z-10">
        
        <!-- Barra di Ricerca -->
        <div class="relative w-full">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-zinc-500 text-sm"></i>
            <input type="text" id="searchInput" oninput="filterWatchlist()" placeholder="Cerca nella tua collezione..." 
                class="w-full bg-zinc-900/80 border border-zinc-800/80 rounded-2xl pl-11 pr-4 py-3 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-purple-500 shadow-inner">
        </div>

        <div id="modeBadge" class="hidden text-center text-[10px] font-mono uppercase tracking-widest bg-purple-500/10 border border-purple-500/20 py-1.5 rounded-xl text-purple-300"></div>

        <!-- Sezione 1: PROSSIME USCITE -->
        <section class="flex flex-col gap-3">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-calendar-days text-purple-400 text-sm"></i>
                <h2 class="text-sm font-bold text-white tracking-wide">Prossime uscite</h2>
                <span id="badgeUpcomingCount" class="text-xs text-zinc-500 font-mono">3</span>
            </div>
            
            <div id="upcomingGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </section>

        <!-- Sezione 2: IN SCADENZA -->
        <section class="flex flex-col gap-3">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-stopwatch text-rose-400 text-sm"></i>
                <h2 class="text-sm font-bold text-white tracking-wide">In scadenza</h2>
                <span id="badgeExpiringCount" class="text-xs text-zinc-500 font-mono">0</span>
            </div>
            
            <div id="expiringGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </section>

        <!-- Sezione 3: IN CORSO -->
        <section class="flex flex-col gap-3 pt-2">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-caret-right text-amber-400 text-sm"></i>
                <h2 class="text-sm font-bold text-white tracking-wide">In corso</h2>
                <span id="badgeInProgressCount" class="text-xs text-zinc-500 font-mono">14</span>
            </div>
            
            <div id="inProgressGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </section>

        <!-- Sezione 4: COMPLETATI -->
        <section class="flex flex-col gap-3 pt-4 border-t border-zinc-800/50">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-check text-emerald-400 text-sm"></i>
                    <h2 class="text-sm font-bold text-white tracking-wide">Completati</h2>
                    <span id="badgeCompletedCount" class="text-xs text-zinc-500 font-mono">183</span>
                </div>
                <button onclick="toggleCompletedSection()" id="btnToggleCompleted" class="text-xs text-zinc-400 hover:text-white flex items-center gap-1 bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-xl">
                    Mostra <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </button>
            </div>
            
            <div id="completedGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 hidden"></div>
        </section>
    </main>

    <!-- Modale Dettaglio Stile Base44 -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-xl w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white bg-zinc-800 p-2 rounded-full w-8 h-8 flex items-center justify-center border border-zinc-700">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <!-- Header -->
            <div class="flex items-center gap-2 mb-4">
                <button onclick="closeDetailModal()" class="text-zinc-400 hover:text-white text-xs flex items-center gap-1">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h3 id="modalTitle" class="text-lg font-bold text-white">---</h3>
            </div>

            <!-- Banner / Locandina Modale -->
            <div class="w-full h-52 bg-zinc-950 rounded-2xl overflow-hidden mb-4 relative border border-zinc-800/80 flex items-center justify-center">
                <img id="modalBanner" src="" class="w-full h-full object-cover" alt="Banner">
            </div>

            <!-- Descrizione -->
            <p id="modalDescription" class="text-xs text-zinc-400 leading-relaxed mb-4">
                ---
            </p>

            <!-- Badge Stato & Piattaforma -->
            <div class="flex flex-wrap items-center gap-2 mb-6">
                <span id="modalStateBadge" class="bg-sky-500/10 border border-sky-500/20 text-sky-400 px-3 py-1 rounded-full text-xs font-semibold">
                    In corso
                </span>
                <span id="modalPlatformBadge" class="bg-zinc-800 border border-zinc-700 text-zinc-300 px-3 py-1 rounded-full text-xs">
                    Su: Disney+
                </span>
            </div>

            <!-- Barra Progresso -->
            <div class="space-y-2 mb-6">
                <div class="flex justify-between items-center text-xs font-bold">
                    <span class="text-zinc-400">Episodi visti</span>
                    <span id="modalProgressText" class="text-white font-mono">25 / 33</span>
                </div>
                <div class="w-full bg-zinc-800 h-2 rounded-full overflow-hidden">
                    <div id="modalProgressBar" class="bg-white h-full transition-all duration-300" style="width: 75%"></div>
                </div>
            </div>

            <!-- Selettore Stagione -->
            <div class="space-y-3 mb-6">
                <select id="modalSeasonSelect" class="w-full bg-zinc-950 border border-zinc-800 text-xs text-white rounded-xl p-3 focus:outline-none focus:border-amber-500">
                </select>
                <div id="modalEpisodesGrid" class="flex flex-wrap gap-2 pt-2"></div>
            </div>

            <!-- Modifica Data Uscita (per Prossime Uscite) -->
            <div class="space-y-1.5 mb-6">
                <label class="block text-[10px] font-bold text-zinc-400 uppercase">Data Prossima Uscita / Scadenza</label>
                <input type="text" id="modalReleaseDateInput" placeholder="es. Dal 1 novembre 2026" class="w-full bg-zinc-950 border border-zinc-800 text-xs text-white rounded-xl p-3 focus:outline-none focus:border-purple-500">
            </div>

            <!-- Bottoni Salva / Elimina -->
            <div class="flex justify-between items-center pt-4 border-t border-zinc-800">
                <button onclick="deleteCurrentModalItem()" class="text-rose-500 hover:text-rose-400 text-xs font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-trash"></i> Elimina
                </button>
                <button onclick="saveModalChanges()" class="bg-white text-black px-6 py-2.5 rounded-xl text-xs font-bold active:scale-95 transition">
                    Salva
                </button>
            </div>

        </div>
    </div>

    <!-- Script Principale -->
    <script>
        // Data Set Iniziale Integrato (Include i 3 titoli da "Prossime uscite" dello screenshot)
        const initialDataset = [
            // Prossime uscite (Screenshot)
            {"id":101, "title":"The Gilded Age", "type":"serie", "category":"upcoming", "status":"In corso", "seriesState":"Rinnovata", "currentEp":25, "totalEp":33, "totalSeasons":4, "platform":"Sky, NOW", "releaseDate":"Dal 1 novembre 2026"},
            {"id":102, "title":"Ginny & Georgia", "type":"serie", "category":"upcoming", "status":"Completata", "seriesState":"Rinnovata", "currentEp":40, "totalEp":40, "totalSeasons":4, "platform":"Netflix", "releaseDate":"Dal 1 gennaio 2027"},
            {"id":103, "title":"Ghosts", "type":"serie", "category":"upcoming", "status":"Completata", "seriesState":"Rinnovata", "currentEp":94, "totalEp":94, "totalSeasons":5, "platform":"Netflix, Paramount+", "releaseDate":"Dal 1 gennaio 2027"},

            // In corso (Screenshot)
            {"id":1, "title":"Abbott Elementary", "type":"serie", "category":"in_progress", "status":"In corso", "seriesState":"Rinnovata", "currentEp":96, "totalEp":99, "totalSeasons":6, "platform":"Disney+"},
            {"id":2, "title":"One Piece", "type":"serie", "category":"in_progress", "status":"In corso", "seriesState":"Rinnovata", "currentEp":155, "totalEp":1181, "totalSeasons":22, "platform":"Netflix, Crunchyroll"},
            {"id":3, "title":"Six Feet Under", "type":"serie", "category":"in_progress", "status":"In corso", "seriesState":"Conclusa", "currentEp":25, "totalEp":63, "totalSeasons":5, "platform":"Netflix, NOW"},
            {"id":4, "title":"Heroes", "type":"serie", "category":"in_progress", "status":"In corso", "seriesState":"Conclusa", "currentEp":40, "totalEp":77, "totalSeasons":4, "platform":"Netflix"},
            {"id":5, "title":"American Horror Story", "type":"serie", "category":"in_progress", "status":"In corso", "seriesState":"Rinnovata", "currentEp":140, "totalEp":145, "totalSeasons":13, "platform":"Disney+"},
            {"id":6, "title":"Criminal Minds", "type":"serie", "category":"in_progress", "status":"In corso", "seriesState":"Rinnovata", "currentEp":350, "totalEp":364, "totalSeasons":19, "platform":"Disney+, Paramount+"},
            {"id":7, "title":"Code Black", "type":"serie", "category":"in_progress", "status":"In corso", "seriesState":"Conclusa", "currentEp":2, "totalEp":47, "totalSeasons":3, "platform":"Disney+"},
            {"id":8, "title":"Lupin", "type":"serie", "category":"in_progress", "status":"In corso", "seriesState":"In produzione", "currentEp":17, "totalEp":18, "totalSeasons":4, "platform":"Netflix"},

            // Completati
            {"id":20, "title":"The Sandman", "type":"serie", "category":"completed", "status":"Completata", "seriesState":"Conclusa", "currentEp":23, "totalEp":23, "totalSeasons":2, "platform":"Netflix"},
            {"id":21, "title":"The Recruit", "type":"serie", "category":"completed", "status":"Completata", "seriesState":"Conclusa", "currentEp":14, "totalEp":14, "totalSeasons":2, "platform":"Netflix"},
            {"id":22, "title":"The Handmaid's Tale", "type":"serie", "category":"completed", "status":"Completata", "seriesState":"Conclusa", "currentEp":66, "totalEp":66, "totalSeasons":6, "platform":"Prime Video"}
        ];

        let watchlist = JSON.parse(localStorage.getItem('cinetracker_b44_v2')) || initialDataset;
        let currentEditingId = null;
        let fxInterval = null;

        function saveToLocalStorage() {
            localStorage.setItem('cinetracker_b44_v2', JSON.stringify(watchlist));
        }

        function resetData() {
            if(confirm("Vuoi ripristinare la collezione con le sezioni aggiornate?")) {
                watchlist = initialDataset;
                saveToLocalStorage();
                filterWatchlist();
            }
        }

        function createPosterFallback(title) {
            const canvas = document.createElement('canvas');
            canvas.width = 300; canvas.height = 450;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 450);
            grad.addColorStop(0, '#1f2029'); grad.addColorStop(1, '#0c0d10');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 300, 450);
            ctx.fillStyle = '#a855f7'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('CINETRACKER', 20, 40);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px sans-serif';
            const words = title.split(' '); let line = '', y = 200;
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > 260 && n > 0) {
                    ctx.fillText(line, 20, y); line = words[n] + ' '; y += 28;
                } else { line = testLine; }
            }
            ctx.fillText(line, 20, y);
            return canvas.toDataURL('image/jpeg', 0.8);
        }

        async function fetchPoster(title) {
            try {
                const res = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(title)}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.image && (data.image.original || data.image.medium)) {
                        return data.image.original || data.image.medium;
                    }
                }
            } catch(e) {}
            return createPosterFallback(title);
        }

        function filterWatchlist() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const canvas = document.getElementById('fxCanvas');
            const badge = document.getElementById('modeBadge');

            canvas.classList.add('hidden');
            if (fxInterval) clearInterval(fxInterval);
            badge.classList.add('hidden');

            if (query === 'matrix') {
                badge.innerText = "🟩 MATRIX DIGITAL RAIN"; badge.classList.remove('hidden'); canvas.classList.remove('hidden'); startMatrixRain();
            } else if (query === 'hogwarts' || query === 'harrypotter') {
                badge.innerText = "✨ HOGWARTS MAGICA"; badge.classList.remove('hidden'); canvas.classList.remove('hidden'); startHogwarts();
            }

            const upcoming = watchlist.filter(i => i.category === 'upcoming' && i.title.toLowerCase().includes(query));
            const expiring = watchlist.filter(i => i.category === 'expiring' && i.title.toLowerCase().includes(query));
            const inProgress = watchlist.filter(i => (i.category === 'in_progress' || (i.status === 'In corso' && i.category !== 'upcoming')) && i.title.toLowerCase().includes(query));
            const completed = watchlist.filter(i => (i.category === 'completed' || (i.status === 'Completata' && i.category !== 'upcoming')) && i.title.toLowerCase().includes(query));

            document.getElementById('badgeUpcomingCount').innerText = upcoming.length;
            document.getElementById('badgeExpiringCount').innerText = expiring.length;
            document.getElementById('badgeInProgressCount').innerText = inProgress.length;
            document.getElementById('badgeCompletedCount').innerText = completed.length;

            renderGrid('upcomingGrid', upcoming, true);
            renderGrid('expiringGrid', expiring, false, true);
            renderGrid('inProgressGrid', inProgress);
            renderGrid('completedGrid', completed);
        }

        function renderGrid(containerId, items, isUpcoming = false, isExpiring = false) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-6 text-left text-xs text-zinc-600 font-mono">Nessun titolo presente.</div>`;
                return;
            }

            items.forEach(async item => {
                const card = document.createElement('div');
                card.className = "flex flex-col justify-between cursor-pointer group";
                card.onclick = () => openDetailModal(item.id);

                const coverUrl = item.customImage || await fetchPoster(item.title);
                item.customImage = coverUrl;

                const isFinished = item.status === 'Completata';
                let statusBadge = isFinished ?
                    `<span class="bg-emerald-950/80 text-emerald-400 border border-emerald-500/30 text-[10px] font-semibold px-2 py-0.5 rounded-full backdrop-blur-md flex items-center gap-1"><i class="fa-solid fa-check text-[8px]"></i> Completata</span>` :
                    `<span class="bg-amber-950/80 text-amber-300 border border-amber-500/30 text-[10px] font-semibold px-2 py-0.5 rounded-full backdrop-blur-md flex items-center gap-1"><i class="fa-solid fa-play text-[8px]"></i> In corso</span>`;

                if (isExpiring) {
                    statusBadge = `<span class="bg-rose-950/80 text-rose-300 border border-rose-500/30 text-[10px] font-semibold px-2 py-0.5 rounded-full backdrop-blur-md flex items-center gap-1"><i class="fa-solid fa-clock text-[8px]"></i> In scadenza</span>`;
                }

                card.innerHTML = `
                    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-lg relative flex flex-col group-hover:border-zinc-700 transition">
                        <div class="h-64 bg-zinc-950 relative overflow-hidden">
                            <img src="${coverUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${item.title}">
                            
                            <!-- Badge in Alto -->
                            <div class="absolute top-2.5 left-2.5">
                                ${statusBadge}
                            </div>

                            <!-- Contatore Episodi in Basso a Destra -->
                            <div class="absolute bottom-2.5 right-2.5 bg-black/80 backdrop-blur-md px-2 py-0.5 rounded-md text-[10px] font-mono font-bold text-white border border-white/10">
                                ${item.currentEp}/${item.totalEp}
                            </div>
                        </div>

                        <!-- Info Card -->
                        <div class="p-3 flex flex-col gap-1">
                            <h3 class="text-xs font-bold text-white truncate">${item.title}</h3>
                            <p class="text-[10px] text-zinc-400 truncate">
                                Serie · ${item.totalSeasons || 4} stag. · ${item.seriesState || 'Rinnovata'}
                            </p>
                            <p class="text-[10px] text-zinc-500 font-medium truncate">
                                ${item.platform || 'Streaming'}
                            </p>
                        </div>
                    </div>

                    <!-- Data Uscita Viola sotto la scheda (Stile Screenshot) -->
                    ${isUpcoming ? `<p class="text-[11px] font-semibold text-indigo-400 mt-2 px-1">${item.releaseDate || 'In arrivo'}</p>` : ''}
                `;
                grid.appendChild(card);
            });
        }

        function toggleCompletedSection() {
            const grid = document.getElementById('completedGrid');
            const btn = document.getElementById('btnToggleCompleted');
            if (grid.classList.contains('hidden')) {
                grid.classList.remove('hidden');
                btn.innerHTML = `Nascondi <i class="fa-solid fa-chevron-up text-[10px]"></i>`;
            } else {
                grid.classList.add('hidden');
                btn.innerHTML = `Mostra <i class="fa-solid fa-chevron-down text-[10px]"></i>`;
            }
        }

        function openDetailModal(id) {
            const item = watchlist.find(i => i.id === id);
            if (!item) return;
            currentEditingId = id;

            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalBanner').src = item.customImage || createPosterFallback(item.title);
            document.getElementById('modalDescription').innerText = item.notes || `${item.title} - Disponibile su ${item.platform || 'Streaming'}.`;
            document.getElementById('modalPlatformBadge').innerText = `Su: ${item.platform || 'Streaming'}`;
            document.getElementById('modalProgressText').innerText = `${item.currentEp} / ${item.totalEp}`;
            document.getElementById('modalProgressBar').style.width = `${Math.min(100, Math.round((item.currentEp / item.totalEp) * 100))}%`;
            document.getElementById('modalReleaseDateInput').value = item.releaseDate || '';

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function saveModalChanges() {
            const item = watchlist.find(i => i.id === currentEditingId);
            if (item) {
                item.releaseDate = document.getElementById('modalReleaseDateInput').value;
                saveToLocalStorage();
                filterWatchlist();
            }
            closeDetailModal();
        }

        function deleteCurrentModalItem() {
            if (confirm("Eliminare il titolo dalla libreria?")) {
                watchlist = watchlist.filter(i => i.id !== currentEditingId);
                saveToLocalStorage();
                filterWatchlist();
                closeDetailModal();
            }
        }

        // Easter Eggs
        function startMatrixRain() {
            const canvas = document.getElementById('fxCanvas'); const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const chars = '01CINETRACKER'; const drops = Array(Math.floor(canvas.width / 12)).fill(1);
            fxInterval = setInterval(() => {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.08)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#22c55e'; ctx.font = '12px monospace';
                drops.forEach((y, i) => { ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 12, y * 12); if (y * 12 > canvas.height && Math.random() > 0.95) drops[i] = 0; drops[i]++; });
            }, 33);
        }

        function startHogwarts() {
            const canvas = document.getElementById('fxCanvas'); const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const sparks = Array.from({length: 40}, () => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 2.5 + 1, s: Math.random() * 1 + 0.5 }));
            fxInterval = setInterval(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#fef08a';
                sparks.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); p.y -= p.s; if (p.y < 0) p.y = canvas.height; });
            }, 30);
        }

        function importExcelFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    if (json && json.length > 0) {
                        watchlist = [];
                        json.forEach((row, idx) => {
                            watchlist.push({
                                id: idx + 1,
                                title: String(row.Titolo || row.title || "Titolo").trim(),
                                type: "serie",
                                category: (row.Categoria || "in_progress"),
                                status: String(row.Stato || "In corso"),
                                seriesState: String(row["Stato Serie"] || "Rinnovata"),
                                currentEp: parseInt(row["Episodi visti"] || row.currentEp || 1),
                                totalEp: parseInt(row["Episodi totali"] || row.totalEp || 12),
                                totalSeasons: parseInt(row["Stagioni totali"] || 1),
                                platform: String(row.Piattaforme || "Streaming"),
                                releaseDate: row["Data Uscita"] || ""
                            });
                        });
                        saveToLocalStorage();
                        filterWatchlist();
                        alert(`Importati ${watchlist.length} titoli dall'Excel!`);
                    }
                } catch(err) { alert("Errore lettura file Excel."); }
            };
            reader.readAsArrayBuffer(file);
        }

        window.addEventListener('DOMContentLoaded', () => filterWatchlist());
    </script>
</body>
</html>
