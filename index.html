<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CineTracker iPhone Pro Max</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS per Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        iframe#netlify-identity-widget, .netlify-identity-menu, a[href*="netlify.com"], div:has(> a[href*="netlify.com"]), [id*="netlify"] {
            display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important;
        }
        body {
            background-color: #000000; color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            transition: all 0.5s ease; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
            padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
        }
        #fxCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; opacity: 0.9; }
        
        .mode-hogwarts { background: radial-gradient(circle at center, #0f172a 0%, #000000 100%) !important; box-shadow: inset 0 0 100px #6366f1; }
        .mode-marvel { background: linear-gradient(135deg, #450a0a 0%, #000000 50%, #172554 100%) !important; }
        .mode-gotham { background-color: #030712 !important; filter: contrast(1.4); }
        .mode-matrix { background-color: #000000 !important; }
        .mode-cyberpunk { background-color: #0d0221 !important; box-shadow: inset 0 0 100px #ff007f; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-44" id="mainBody">

    <canvas id="fxCanvas" class="hidden"></canvas>

    <!-- Header -->
    <header class="px-4 py-3 flex justify-between items-center bg-black/90 backdrop-blur-xl sticky top-0 z-40 border-b border-white/10">
        <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold tracking-tight text-white">CineTracker</h1>
            <span class="text-[9px] bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-full font-mono uppercase flex items-center gap-1">
                <i class="fa-solid fa-sparkles"></i> AI Pro
            </span>
        </div>
        <div class="flex items-center gap-1.5">
            <button onclick="openApiKeyModal()" class="bg-white/10 active:scale-95 text-zinc-300 px-2.5 py-1.5 rounded-xl text-xs flex items-center gap-1 border border-white/10">
                <i class="fa-solid fa-key text-yellow-400"></i>
            </button>
            <label class="bg-white/10 active:scale-95 text-white px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 cursor-pointer border border-white/10">
                <i class="fa-solid fa-file-arrow-up text-indigo-400"></i> Importa Excel
                <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" onchange="importExcelFile(event)" class="hidden">
            </label>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow px-4 flex flex-col gap-3 max-w-md mx-auto w-full z-10 pt-3" id="mainContainer">
        
        <div class="relative w-full">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-zinc-400 text-xs"></i>
            <input type="text" id="searchInput" oninput="filterWatchlist()" placeholder="Cerca o digita un easter egg (es. matrix, starwars...)" 
                class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-purple-500 shadow-lg">
        </div>

        <div id="modeBadge" class="hidden text-center text-[10px] font-mono uppercase tracking-widest bg-white/5 border border-white/10 py-1.5 rounded-xl text-purple-300"></div>

        <div class="grid grid-cols-2 gap-2.5">
            <div class="bg-zinc-900/80 border border-zinc-800/80 rounded-2xl p-3 flex items-center gap-3">
                <div class="bg-emerald-500/10 text-emerald-400 p-2.5 rounded-xl"><i class="fa-solid fa-tv text-sm"></i></div>
                <div>
                    <p class="text-[9px] uppercase font-bold text-zinc-400">Serie Viste</p>
                    <p id="statCompletedSeries" class="text-sm font-extrabold text-white">0</p>
                </div>
            </div>
            <div class="bg-zinc-900/80 border border-zinc-800/80 rounded-2xl p-3 flex items-center gap-3">
                <div class="bg-indigo-500/10 text-indigo-400 p-2.5 rounded-xl"><i class="fa-solid fa-film text-sm"></i></div>
                <div>
                    <p class="text-[9px] uppercase font-bold text-zinc-400">Film Visti</p>
                    <p id="statCompletedMovies" class="text-sm font-extrabold text-white">0</p>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
            <button onclick="setStatusFilter('Tutti', this)" class="filter-pill px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap bg-purple-600 text-white shadow-md transition">Tutti</button>
            <button onclick="setStatusFilter('In corso', this)" class="filter-pill px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap bg-zinc-900 text-zinc-300 border border-zinc-800">In Corso</button>
            <button onclick="setStatusFilter('Completati', this)" class="filter-pill px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap bg-zinc-900 text-zinc-300 border border-zinc-800">Completati</button>
            <button onclick="setStatusFilter('Da guardare', this)" class="filter-pill px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap bg-zinc-900 text-zinc-300 border border-zinc-800">Da Guardare</button>
        </div>

        <div id="watchlistGrid" class="grid grid-cols-2 gap-3 pb-32"></div>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-6 left-4 right-4 bg-zinc-900/90 backdrop-blur-2xl border border-white/10 px-6 py-3 flex justify-around items-center z-50 max-w-sm mx-auto rounded-3xl shadow-2xl">
        <button onclick="filterWatchlist()" class="flex flex-col items-center gap-1 text-purple-400">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] font-medium">Libreria</span>
        </button>
        <button onclick="openAddModal()" class="flex flex-col items-center gap-1 text-zinc-400 hover:text-white">
            <div class="bg-purple-600 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg shadow-purple-600/40 -mt-3">
                <i class="fa-solid fa-plus text-sm"></i>
            </div>
            <span class="text-[10px] font-medium">Aggiungi</span>
        </button>
        <button onclick="runAIBulkEnhance()" class="flex flex-col items-center gap-1 text-indigo-400">
            <i class="fa-solid fa-wand-magic-sparkles text-base"></i>
            <span class="text-[10px] font-medium">IA Sync</span>
        </button>
    </nav>

    <!-- Modal API Key -->
    <div id="apiKeyModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-key text-yellow-400"></i> API TMDB</h3>
                <button onclick="closeApiKeyModal()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-[11px] text-zinc-400">Inserisci la tua chiave API di TMDB per locandine e dettagli.</p>
            <input type="text" id="apiKeyInput" placeholder="Inserisci API Key..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeApiKeyModal()" class="bg-zinc-800 text-zinc-300 px-4 py-2 rounded-xl text-xs">Annulla</button>
                <button onclick="saveApiKey()" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-xs font-semibold">Salva</button>
            </div>
        </div>
    </div>

    <!-- Modal Gestione Titolo -->
    <div id="itemModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-end justify-center sm:items-center sm:p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-t-3xl sm:rounded-2xl max-w-md w-full p-6 shadow-2xl relative max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-base font-bold text-white">Gestisci Titolo</h3>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="itemForm" onsubmit="saveItem(event)" class="space-y-3">
                <input type="hidden" id="itemId">
                
                <div>
                    <label class="block text-[10px] font-semibold text-zinc-400 uppercase mb-1">Titolo</label>
                    <input type="text" id="formTitle" onblur="autoFetchAIMetadataField()" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500" placeholder="Es. Stranger Things">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-semibold text-zinc-400 uppercase mb-1">Tipo</label>
                        <select id="formType" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
                            <option value="serie">Serie TV</option>
                            <option value="film">Film</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-zinc-400 uppercase mb-1">Stato Serie</label>
                        <select id="formSeriesState" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
                            <option value="In corso">In corso</option>
                            <option value="Finita">Finita</option>
                            <option value="Cancellata">Cancellata</option>
                        </select>
                    </div>
                </div>

                <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-800 space-y-3">
                    <p class="text-[10px] font-semibold text-purple-400 uppercase">A che punto sei arrivato?</p>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[9px] text-zinc-400 uppercase mb-1">Stagione</label>
                            <input type="number" id="formCurrentSeason" min="1" value="1" onchange="recalculateEpisodes()" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-xs text-white text-center font-bold">
                        </div>
                        <div>
                            <label class="block text-[9px] text-zinc-400 uppercase mb-1">Episodio in Stagione</label>
                            <input type="number" id="formCurrentEpInSeason" min="1" value="1" onchange="recalculateEpisodes()" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-xs text-white text-center font-bold">
                        </div>
                    </div>
                    <div class="text-[10px] text-zinc-400 text-center pt-1">
                        Progressione globale stimata: <span id="progressPreview" class="text-white font-semibold">Episodio 1</span>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-semibold text-zinc-400 uppercase mb-1">Piattaforma / Note</label>
                    <input type="text" id="formNotes" placeholder="Netflix, Prime..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
                </div>

                <input type="hidden" id="formCurrentEp" value="1">
                <input type="hidden" id="formTotalEp" value="1">
                <input type="hidden" id="formCustomImage" value="">
                <input type="hidden" id="formSeasonsData" value="">

                <div class="flex justify-between items-center pt-4 border-t border-zinc-800">
                    <button type="button" id="deleteBtn" onclick="deleteCurrentItem()" class="bg-rose-500/10 text-rose-400 px-4 py-2.5 rounded-xl text-xs font-medium hidden">Elimina</button>
                    <div class="flex gap-2 ml-auto">
                        <button type="button" onclick="closeModal()" class="bg-zinc-800 text-zinc-300 px-4 py-2.5 rounded-xl text-xs font-medium">Annulla</button>
                        <button type="submit" class="bg-purple-600 text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-purple-600/30">Salva</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Pro Max -->
    <script>
        let watchlist = JSON.parse(localStorage.getItem('cinetracker_iphone_promax_data')) || [];
        let tmdbApiKey = localStorage.getItem('tmdb_api_key') || '33501d24ebf664a784d142d765bcf410';
        let currentStatusFilter = 'Tutti';
        let fxInterval = null;

        function saveToLocalStorage() {
            localStorage.setItem('cinetracker_iphone_promax_data', JSON.stringify(watchlist));
        }

        function openApiKeyModal() {
            document.getElementById('apiKeyInput').value = tmdbApiKey;
            document.getElementById('apiKeyModal').classList.remove('hidden');
        }
        function closeApiKeyModal() { document.getElementById('apiKeyModal').classList.add('hidden'); }
        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                tmdbApiKey = key;
                localStorage.setItem('tmdb_api_key', key);
                alert("Chiave API salvata!");
                closeApiKeyModal();
            }
        }

        function updateStats() {
            const completedSeries = watchlist.filter(i => i.type === 'serie' && i.currentEp >= i.totalEp && i.totalEp > 0).length;
            const completedMovies = watchlist.filter(i => i.type === 'film' && i.currentEp >= i.totalEp).length;
            document.getElementById('statCompletedSeries').innerText = completedSeries;
            document.getElementById('statCompletedMovies').innerText = completedMovies;
        }

        async function fetchMetadataForTitle(title) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${tmdbApiKey}&query=${encodeURIComponent(title)}&language=it-IT`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    const item = data.results.find(r => r.poster_path);
                    if (item) {
                        let totalEp = 1;
                        let seriesState = 'In corso';
                        let seasonsArray = [];
                        let mediaType = item.media_type || (item.title ? 'movie' : 'tv');
                        
                        if (mediaType === 'tv' && item.id) {
                            const detailRes = await fetch(`https://api.themoviedb.org/3/tv/${item.id}?api_key=${tmdbApiKey}&language=it-IT`);
                            const detailData = await detailRes.json();
                            if (detailData.number_of_episodes) totalEp = detailData.number_of_episodes;
                            if (detailData.status === 'Ended' || detailData.status === 'Canceled') {
                                seriesState = detailData.status === 'Canceled' ? 'Cancellata' : 'Finita';
                            }
                            if (detailData.seasons) {
                                seasonsArray = detailData.seasons.filter(s => s.season_number > 0).map(s => ({
                                    season_number: s.season_number,
                                    episode_count: s.episode_count || 10
                                }));
                            }
                        } else {
                            seriesState = 'Finita';
                        }

                        return {
                            poster: `https://image.tmdb.org/t/p/w500${item.poster_path}`,
                            totalEp: totalEp,
                            seriesState: seriesState,
                            seasonsData: seasonsArray,
                            type: mediaType === 'movie' ? 'film' : 'serie'
                        };
                    }
                }
            } catch (e) {}
            return { 
                poster: `https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&auto=format&fit=crop`, 
                totalEp: 1,
                seriesState: 'In corso',
                seasonsData: [],
                type: 'serie' 
            };
        }

        async function autoFetchAIMetadataField() {
            const title = document.getElementById('formTitle').value.trim();
            if (!title) return;
            const meta = await fetchMetadataForTitle(title);
            document.getElementById('formCustomImage').value = meta.poster;
            document.getElementById('formTotalEp').value = meta.totalEp;
            document.getElementById('formType').value = meta.type;
            document.getElementById('formSeriesState').value = meta.seriesState;
            document.getElementById('formSeasonsData').value = JSON.stringify(meta.seasonsData);
            recalculateEpisodes();
        }

        function recalculateEpisodes() {
            const season = parseInt(document.getElementById('formCurrentSeason').value) || 1;
            const epInSeason = parseInt(document.getElementById('formCurrentEpInSeason').value) || 1;
            const seasonsDataStr = document.getElementById('formSeasonsData').value;
            
            let currentGlobal = epInSeason;
            if (seasonsDataStr) {
                try {
                    const seasons = JSON.parse(seasonsDataStr);
                    currentGlobal = 0;
                    for (let s of seasons) {
                        if (s.season_number < season) {
                            currentGlobal += s.episode_count;
                        } else if (s.season_number === season) {
                            currentGlobal += epInSeason;
                            break;
                        }
                    }
                } catch(e) {}
            }
            document.getElementById('formCurrentEp').value = currentGlobal;
            document.getElementById('progressPreview').innerText = `Stagione ${season} - Episodio ${epInSeason}`;
        }

        async function runAIBulkEnhance() {
            alert("L'IA sta sincronizzando locandine e stagioni per tutti i titoli...");
            for (let item of watchlist) {
                const meta = await fetchMetadataForTitle(item.title);
                if (!item.customImage || item.customImage.includes('unsplash')) item.customImage = meta.poster;
                if (!item.totalEp || item.totalEp <= 1) item.totalEp = meta.totalEp;
                if (!item.seasonsData) item.seasonsData = meta.seasonsData;
            }
            saveToLocalStorage();
            filterWatchlist();
            alert("Sincronizzazione completata!");
        }

        async function importExcelFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    if (json && json.length > 0) {
                        watchlist = [];
                        for (let index = 0; index < json.length; index++) {
                            const row = json[index];
                            const rawTitle = row.Titolo || row.title || row[Object.keys(row)[0]] || "Senza titolo";
                            const meta = await fetchMetadataForTitle(rawTitle);

                            const currentEp = parseInt(row["Episodi Visti"] || row.currentEp || 0);
                            const totalEp = parseInt(row["Episodi Totali"] || row.totalEp || meta.totalEp);

                            watchlist.push({
                                id: Date.now() + index,
                                title: rawTitle,
                                type: (row.Tipo || row.type || meta.type).toLowerCase().includes("film") ? "film" : "serie",
                                seriesState: row["Stato Serie"] || row.seriesState || meta.seriesState,
                                currentEp: currentEp,
                                totalEp: totalEp,
                                seasonsData: meta.seasonsData,
                                customImage: meta.poster,
                                notes: row["Note / Piattaforma"] || row.notes || ""
                            });
                        }
                        saveToLocalStorage();
                        filterWatchlist();
                        alert(`Importati ${watchlist.length} titoli con successo!`);
                    }
                } catch (err) {
                    alert("Errore nell'importazione.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function getSeasonAndEpisode(item) {
            if (!item.seasonsData || item.seasonsData.length === 0) {
                return `Episodio ${item.currentEp}`;
            }
            let acc = 0;
            for (let s of item.seasonsData) {
                if (item.currentEp <= acc + s.episode_count) {
                    let epInSeason = item.currentEp - acc;
                    return `S${String(s.season_number).padStart(2, '0')}E${String(epInSeason).padStart(2, '0')}`;
                }
                acc += s.episode_count;
            }
            return `Episodio ${item.currentEp}`;
        }

        // Tutti i 20+ Easter Egg con motori grafici dedicati
        function filterWatchlist() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const body = document.body;
            const canvas = document.getElementById('fxCanvas');
            const badge = document.getElementById('modeBadge');
            
            body.className = "min-h-screen flex flex-col pb-44";
            canvas.classList.add('hidden');
            if (fxInterval) clearInterval(fxInterval);
            badge.classList.add('hidden');

            if (query === 'matrix') {
                badge.innerText = "🟩 MATRIX DIGITAL RAIN"; badge.classList.remove('hidden'); canvas.classList.remove('hidden');
                startMatrixRain();
            } else if (query === 'starwars' || query === 'warp') {
                badge.innerText = "🚀 STAR WARS WARP SPEED"; badge.classList.remove('hidden'); canvas.classList.remove('hidden');
                startWarpSpeed();
            } else if (query === 'cyberpunk' || query === 'neon') {
                badge.innerText = "⚡ CYBERPUNK GLITCH"; badge.classList.remove('hidden'); canvas.classList.remove('hidden');
                body.classList.add('mode-cyberpunk'); startCyberGlitch();
            } else if (query === 'avengers' || query === 'infinity') {
                badge.innerText = "🔮 INFINITY STONES"; badge.classList.remove('hidden'); canvas.classList.remove('hidden');
                startInfinityStones();
            } else if (query === 'interstellar' || query === 'blackhole') {
                badge.innerText = "🌌 INTERSTELLAR BLACK HOLE"; badge.classList.remove('hidden'); canvas.classList.remove('hidden');
                startBlackHole();
            } else if (query === 'lordoftherings' || query === 'ring') {
                badge.innerText = "💍 THE ONE RING MORDOR"; badge.classList.remove('hidden'); canvas.classList.remove('hidden');
                startMordorFire();
            } else if (query === 'jurassic' || query === 'dino') {
                badge.innerText = "🦖 JURASSIC JUNGLE MIST"; badge.classList.remove('hidden'); canvas.classList.remove('hidden');
                startJungleMist();
            } else if (query === 'spiderman' || query === 'spider') {
                badge.innerText = "🕸️ SPIDER-VERSE WEB"; badge.classList.remove('hidden'); canvas.classList.remove('hidden');
                startSpiderWeb();
            } else if (query === 'deadpool' || query === 'chimichanga') {
                badge.innerText = "💥 DEADPOOL CHAOS"; badge.classList.remove('hidden'); canvas.classList.remove('hidden');
                startDeadpoolChaos();
            } else if (query === 'bladeblaster' || query === 'bladerunner') {
                badge.innerText = "🌧️ BLADE RUNNER ACID RAIN"; badge.classList.remove('hidden'); canvas.classList.remove('hidden');
                startAcidRain();
            } else if (query === 'terminator' || query === 'skynet') {
                badge.innerText = "🤖 SKYNET HUD SCANNER"; badge.classList.remove('hidden'); canvas.classList.remove('hidden');
                startSkynetHUD();
            } else if (query === 'dune' || query === 'arrakis') {
                badge.innerText = "🏜️ DUNE SPICE STORM"; badge.classList.remove('hidden'); canvas.classList.remove('hidden');
                startSpiceStorm();
            } else if (query === 'tron' || query === 'grid') {
                badge.innerText = "🔷 TRON DIGITAL GRID"; badge.classList.remove('hidden'); canvas.classList.remove('hidden');
                startTronGrid();

        function startMatrixRain() {
            const canvas = document.getElementById('fxCanvas'); const ctx = canvas.getContext('2d');

            const chars = '01ABCDEFGHIKLMNOPQRSTUVWXYZ@#$%&';

                ctx.fillStyle = '#00ff66'; ctx.font = 'bold 15px monospace';

        function startWarpSpeed() {
            const canvas = document.getElementById('fxCanvas'); const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const cx = canvas.width / 2, cy = canvas.height / 2;
            const stars = Array.from({length: 120}, () => ({ x: (Math.random() - 0.5) * canvas.width, y: (Math.random() - 0.5) * canvas.height, z: Math.random() * canvas.width }));
            fxInterval = setInterval(() => {
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#ffffff';
                stars.forEach(s => {
                    s.z -= 10; if (s.z <= 0) s.z = canvas.width;
                    const k = 250 / s.z, px = s.x * k + cx, py = s.y * k + cy;
                    if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                        ctx.fillRect(px, py, Math.max(1, 2 * k), Math.max(1, 2 * k));
                    }
                });
            }, 30);
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = "Aggiungi Titolo";

        function openEditModal(id) {
            const item = watchlist.find(i => i.id === id);
            if (!item) return;
            document.getElementById('modalTitle').innerText = "Modifica Titolo";
            document.getElementById('itemId').value = item.id;
            document.getElementById('formTitle').value = item.title;
            document.getElementById('formType').value = item.type || 'serie';
            document.getElementById('formSeriesState').value = item.seriesState || 'In corso';
            document.getElementById('formNotes').value = item.notes || '';
            document.getElementById('formCustomImage').value = item.customImage || '';
            document.getElementById('formSeasonsData').value = JSON.stringify(item.seasonsData || []);
            document.getElementById('formTotalEp').value = item.totalEp || 1;

            let season = 1, epInSeason = item.currentEp || 1;
            if (item.seasonsData && item.seasonsData.length > 0) {
                let acc = 0;
                let found = false;
                for (let s of item.seasonsData) {
                    if (item.currentEp <= acc + s.episode_count) {
                        season = s.season_number;
                        epInSeason = Math.max(1, item.currentEp - acc);
                        found = true;
                        break;
                    }
                    acc += s.episode_count;
                }
                if (!found) { season = 1; epInSeason = item.currentEp; }
            }
            document.getElementById('formCurrentSeason').value = season;
            document.getElementById('formCurrentEpInSeason').value = epInSeason;
            recalculateEpisodes();

            document.getElementById('deleteBtn').classList.remove('hidden');
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('itemModal').classList.add('hidden'); }

        async function saveItem(event) {
            event.preventDefault();
            const id = document.getElementById('itemId').value;
            const title = document.getElementById('formTitle').value;
            const type = document.getElementById('formType').value;
            const seriesState = document.getElementById('formSeriesState').value;
            const currentEp = parseInt(document.getElementById('formCurrentEp').value) || 1;
            const totalEp = parseInt(document.getElementById('formTotalEp').value) || 1;
            const seasonsData = JSON.parse(document.getElementById('formSeasonsData').value || '[]');
            let customImage = document.getElementById('formCustomImage').value;
            const notes = document.getElementById('formNotes').value;

            if (!customImage) {
                const meta = await fetchMetadataForTitle(title);
                customImage = meta.poster;
            }

            if (id) {
                const item = watchlist.find(i => i.id == id);
                if (item) {
                    item.title = title; item.type = type; item.seriesState = seriesState;
                    item.currentEp = currentEp; item.totalEp = totalEp; item.seasonsData = seasonsData;
                    item.customImage = customImage; item.notes = notes;
                }
            } else {
                watchlist.unshift({ id: Date.now(), title, type, seriesState, currentEp, totalEp, seasonsData, customImage, notes });
            }

            saveToLocalStorage();
            closeModal();
            filterWatchlist();
        }

        function deleteCurrentItem() {
            const id = document.getElementById('itemId').value;
            if (id && confirm("Eliminare questo titolo?")) {
                watchlist = watchlist.filter(i => i.id != id);
                saveToLocalStorage();
                closeModal();
                filterWatchlist();
            }
        }

        window.addEventListener('DOMContentLoaded', () => filterWatchlist());
    </script>
</body>
